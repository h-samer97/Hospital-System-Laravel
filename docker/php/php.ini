; ===== Memory & Performance =====
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; ===== File Uploads =====
upload_max_filesize = 10M
post_max_size = 12M

; ===== OPcache — يُسرّع PHP بتخزين bytecode =====
; بدون OPcache: PHP يُحوّل كل ملف PHP لـ bytecode عند كل request
; مع OPcache: يُحوّل مرة واحدة فقط ويخزّن في memory
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0         ; 0 = لا تتحقق من التغييرات (إنتاج فقط)
opcache.validate_timestamps = 0     ; 0 = الأسرع، لكن يلزم restart عند تغيير الكود
opcache.jit = tracing               ; PHP 8 JIT — تسريع إضافي
opcache.jit_buffer_size = 64M

; ===== Security =====
expose_php = Off                    ; لا تُظهر إصدار PHP في الـ headers
display_errors = Off                ; مهم في الإنتاج
log_errors = On
error_log = /var/log/php/errors.log

; ===== Session =====
session.gc_maxlifetime = 1800