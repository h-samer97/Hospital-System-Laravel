# ===== Upstream =====
# نُعرّف PHP-FPM كـ upstream لاستخدامه في كل location
upstream php_fpm {
    server php:9000;
    keepalive 32;   # إعادة استخدام connections بدل فتح جديدة
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # ===== SSL =====
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ===== Security Headers =====
    add_header X-Frame-Options          "SAMEORIGIN"            always;
    add_header X-Content-Type-Options   "nosniff"               always;
    add_header X-XSS-Protection         "1; mode=block"         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ===== Gzip Compression =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml;

    # ===== Client Limits =====
    client_max_body_size    15M;
    client_body_buffer_size 128k;

    # ===== Static Files Cache =====
    # ملفات CSS/JS/Images تُخزَّن في متصفح المستخدم 1 سنة
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;             # لا نسجل طلبات الملفات الثابتة
    }

    # ===== Laravel Entry Point =====
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===== PHP Processing =====
    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Timeouts للعمليات الطويلة
        fastcgi_read_timeout    120s;
        fastcgi_connect_timeout 60s;

        # Buffering يُحسّن الأداء
        fastcgi_buffer_size         128k;
        fastcgi_buffers             4 256k;
        fastcgi_busy_buffers_size   256k;
    }

    # ===== Security: Block sensitive files =====
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}