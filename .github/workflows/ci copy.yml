name: Valex CI/CD Pipeline

# يعمل عند:
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# الأذونات اللازمة فقط (Principle of Least Privilege)
permissions:
  contents: read
  pull-requests: write

jobs:

  # ============================================================
  # Job 1: Code Quality (Lint)
  # ============================================================
  lint:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer Packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP Dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

  # ============================================================
  # Job 2: Tests
  # ============================================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    strategy:
      matrix:
        php: ['8.4'] # تحديث المصفوفة لتشمل الإصدار المتوافق 8.4 فقط حالياً
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug

      - name: Cache Composer Packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install PHP Dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Run Pest Tests
        run: ./vendor/bin/pest --coverage --min=70
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE:   database/database.sqlite
          CACHE_DRIVER:  array
          QUEUE_CONNECTION: sync

      - name: Upload Coverage Report
        if: matrix.php == '8.4' # التحديث ليتوافق مع الإصدار الجديد
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================================
  # Job 3: Build Docker Image
  # ============================================================
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push PHP Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/valex-php:latest
            ${{ secrets.DOCKER_USERNAME }}/valex-php:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/valex-php:latest
          cache-to:   type=inline

  # ============================================================
  # Job 4: Deploy (Production)
  # ============================================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check production secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.PROD_HOST }}" ] && [ -n "${{ secrets.PROD_USER }}" ] && [ -n "${{ secrets.PROD_SSH_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no production server yet)
        if: steps.check_secrets.outputs.configured == 'false'
        run: |
          echo "⚠️  Deploy skipped: PROD_HOST / PROD_USER / PROD_SSH_KEY not configured yet."
          echo "This step will activate automatically once those secrets are added."

      - name: Deploy via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            cd /var/www/valex

            echo "📦 Pulling latest code..."
            git pull origin main

            echo "🐳 Pulling new Docker image..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull php

            echo "🚀 Rolling update (zero downtime)..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps php

            echo "🔄 Running migrations..."
            docker compose exec -T php php artisan migrate --force

            echo "⚡ Optimizing..."
            docker compose exec -T php php artisan config:cache
            docker compose exec -T php php artisan route:cache
            docker compose exec -T php php artisan view:cache

            echo "🧹 Clearing old images..."
            docker image prune -f

            echo "✅ Deploy complete!"