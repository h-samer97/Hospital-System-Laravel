name: valex-hospital

services:

  # ===== PHP-FPM =====
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: valex_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Mount كود المشروع مباشرة — التغييرات تظهر فوراً بدون rebuild
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/valex.ini:ro
      # Volume منفصل لـ vendor — أسرع من sync كل مرة
      - vendor_data:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy # انتظر حتى MySQL جاهز فعلاً
      redis:
        condition: service_healthy
    networks:
      - valex_network

  # ===== Nginx =====
  nginx:
    image: nginx:1.25-alpine
    container_name: valex_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/var/www/html:ro # read-only — Nginx لا يكتب
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro # شهادات SSL
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - valex_network

  # ===== MySQL =====
  mysql:
    image: mysql:8.0
    container_name: valex_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_root}
      MYSQL_DATABASE: ${DB_DATABASE:-valex}
      MYSQL_USER: ${DB_USERNAME:-valex_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-valex_pass}
    ports:
      - "3307:3306" # 3307 لتجنب التعارض مع MySQL المحلي
    volumes:
      - mysql_data:/var/lib/mysql # persistence — البيانات لا تُحذف مع الـ container
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/valex.cnf:ro
      - mysql_logs:/var/log/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-secret_root}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - valex_network

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: valex_redis
    restart: unless-stopped
    # كلمة مرور + persistence (AOF = Append Only File)
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379" # 6380 لتجنب التعارض
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - valex_network

  # ===== Queue Worker =====
  # container مخصص لمعالجة الـ Jobs
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: valex_queue
    restart: unless-stopped
    working_dir: /var/www/html
    # يُشغّل الـ queue worker بدل php-fpm
    command: php artisan queue:work redis --tries=3 --timeout=90 --sleep=3
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - valex_network

  # ===== Task Scheduler =====
  # يُشغّل artisan schedule:run كل دقيقة (بديل cron خارجي)
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: valex_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do
        php artisan schedule:run --no-interaction;
        sleep 60;
      done"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - valex_network

# ===== Networks =====
networks:
  valex_network:
    driver: bridge
    # subnet مخصص لتجنب التعارض مع networks أخرى
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ===== Volumes =====
volumes:
  mysql_data: # البيانات الدائمة
  redis_data: # بيانات Redis (AOF)
  vendor_data: # Laravel vendor — مشترك بين php, queue, scheduler
  nginx_logs:
  mysql_logs:
